name: Run Phygital News Bot

on:
  schedule:
    - cron: '0 20 * * 6' # 20:00 UTC (Суббота) = 02:00 Бишкек (Воскресенье)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser deep-translator pdfplumber

      - name: Запуск парсера новостей
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
      
      - name: Сохранение истории и обновленной базы
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add source_links.txt sent_articles.txt
          git commit -m "Бот: обновление истории отправки и базы ссылок" || echo "Нет изменений"
          git push
