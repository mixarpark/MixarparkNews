name: Run RSS Scout

on:
  schedule:
    - cron: '0 10 * * 6' # Каждую субботу в 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser

      - name: Запуск Разведчика
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scout.py
      
      - name: Сохранение карантинных ссылок
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pending_sources.txt
          git commit -m "Разведка: добавлены новые потенциальные источники" || echo "Нет новых источников"
          git push
