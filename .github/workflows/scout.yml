name: Run Phygital Scout

on:
  schedule:
    - cron: '0 18 * * 6' # 18:00 UTC (Суббота) = 00:00 Бишкек (Воскресенье)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser deep-translator

      - name: Запуск Разведчика
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python scout.py
      
      - name: Сохранение базы источников
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add source_links.txt
          git commit -m "Разведка: добавлены новые источники" || echo "Нет изменений"
          git push
